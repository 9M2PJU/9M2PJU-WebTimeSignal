name: Tests

on:
  push:
  pull_request:

jobs:
  node-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        timezone: ['UTC', 'Asia/Tokyo', 'America/New_York']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests (TZ=${{ matrix.timezone }})
        run: npm test
        env:
          TZ: ${{ matrix.timezone }}
