<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ea043" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#30363d" stroke-width="12"/>
  
  <!-- Outer Radio Wave Arcs -->
  <path d="M 120 180 A 180 180 0 0 1 392 180" fill="none" stroke="#58a6ff" stroke-width="24" stroke-linecap="round" opacity="0.4"/>
  <path d="M 160 220 A 130 130 0 0 1 352 220" fill="none" stroke="#58a6ff" stroke-width="24" stroke-linecap="round" opacity="0.7"/>
  <path d="M 200 260 A 80 80 0 0 1 312 260" fill="none" stroke="#58a6ff" stroke-width="24" stroke-linecap="round"/>

  <!-- Antenna Tower / Emitter Center -->
  <circle cx="256" cy="300" r="28" fill="url(#accent)"/>
  <polygon points="256,310 216,420 296,420" fill="none" stroke="#f0f6fc" stroke-width="16" stroke-linejoin="round"/>
  <line x1="230" y1="370" x2="282" y2="370" stroke="#f0f6fc" stroke-width="14"/>

  <!-- Clock Hands Motif -->
  <circle cx="256" cy="300" r="6" fill="#ffffff"/>
</svg>
